name: aarogya_ai
description: Offline-first multilingual healthcare intelligence for rural India.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  llama_flutter_android: ^0.2.0
  whisper_ggml: ^2.7.1

  # State management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Local database
  drift: ^2.14.1
  drift_flutter: ^0.1.0
  sqlite3_flutter_libs: ^0.5.18
  path_provider: ^2.1.1
  path: ^1.9.0

  # AI inference (llama.cpp FFI bridge - see android/app/src/main/cpp/)
  ffi: ^2.1.0

  # Audio recording & playback
  record: ^6.1.1
  audioplayers: ^6.0.0
  flutter_tts: ^3.8.5
  permission_handler: ^11.1.0

  # Connectivity
  connectivity_plus: ^5.0.2

  # Notifications & background tasks
  flutter_local_notifications: ^17.2.1
  workmanager: ^0.9.0+3

  # HTTP & storage (for model download)
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0

  # UI utilities
  go_router: ^13.1.0
  cached_network_image: ^3.3.1
  lottie: ^3.0.0
  shimmer: ^3.0.0
  intl: ^0.20.2

  # Utils
  logger: ^2.0.2+1
  uuid: ^4.3.3
  shared_preferences: ^2.2.2
  package_info_plus: ^9.0.1
  device_info_plus: ^10.1.0
  get_it: ^7.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  drift_dev: ^2.14.1
  bloc_test: ^9.1.5
  mocktail: ^1.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/models/           # GGUF model placeholder (downloaded at runtime)
    - assets/prompts/          # System prompts for clinical AI
    - assets/first_aid/        # Offline first-aid playbooks (JSON)
    - assets/lang/             # Language config files

  fonts:
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
        - asset: assets/fonts/NotoSansDevanagari-Bold.ttf
          weight: 700
